services:
  web:
    build: .
    init: true
    restart: unless-stopped
    env_file: .env
    environment:
      DATABASE_URL: file:data/spy-game.sqlite
      LANGGRAPH_CHECKPOINT_PATH: data/langgraph-checkpoints.sqlite
    ports:
      - "3000:3000"
    volumes:
      - spy-game-data:/app/data
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - fetch('http://127.0.0.1:3000/api/access').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  worker:
    build: .
    init: true
    restart: unless-stopped
    command: ["pnpm", "worker"]
    env_file: .env
    environment:
      DATABASE_URL: file:data/spy-game.sqlite
      LANGGRAPH_CHECKPOINT_PATH: data/langgraph-checkpoints.sqlite
    volumes:
      - spy-game-data:/app/data
    depends_on:
      web:
        condition: service_healthy

volumes:
  spy-game-data:
